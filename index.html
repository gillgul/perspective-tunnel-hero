<!doctype html>

<body>
<section class="tunnel" id="tunnel" aria-label="Into the Ether">
  <div class="grid" aria-hidden="true"></div>
  <div class="glow" aria-hidden="true"></div>
  <div class="ring ring--inner" aria-hidden="true"></div>
  <div class="ring ring--outer" aria-hidden="true"></div>

  <div class="title" id="title">
    <p class="eyebrow">Warp Drive Sequence</p>
    <h1>INTO THE<br />ETHER.</h1>
    <p class="lede">Scroll your trackpad or mouse wheel to fly through the spatial 3D corridor.</p>
  </div>

  <div class="prompt" id="prompt" aria-hidden="true"><span>Scroll to Explore</span><i></i></div>

  <div class="plane" id="plane"></div>
</section>
